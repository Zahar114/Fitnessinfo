{% extends 'gym/base.html' %}

{% block content %}

<h2>Харчування</h2>

{% for plan in nutrition_plans %}
    <div>
        <h3>{{ plan.name }}</h3>
        <p><b>Калорії:</b> {{ plan.calories }}</p>
        <p><b>Білки:</b> {{ plan.protein }} г</p>
        <p>{{ plan.description }}</p>
    </div>
    <hr>
{% endfor %}

<a href="{% url 'home' %}">Повернутися на головну</a>

{% endblock %}
